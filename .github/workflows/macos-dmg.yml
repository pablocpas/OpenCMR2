name: macos-dmg

# Manual only: builds the macOS arm64 package, assembles OpenCMR2.app (a launcher that reproduces
# rebuild.sh --all-mods from the user's own game folder), wraps it in a versioned DMG and runs launch-path
# checks (no gameplay: that needs the user's game data).
# The app and the DMG are signed with the Developer ID Application identity (not notarized yet).
# No game assets are included. Free on this public repository; one macOS job.
on:
  workflow_dispatch:
  push:
    branches: ['dmg-build/**']

permissions:
  contents: read

jobs:
  dmg:
    timeout-minutes: 60
    runs-on: macos-14
    steps:
      - run: brew install ninja glslang
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m venv .ci-python
      - run: .ci-python/bin/python -m pip install -r tools/scenery-patch/requirements.txt
      - run: echo "$GITHUB_WORKSPACE/.ci-python/bin" >> "$GITHUB_PATH"
      - run: cmake --preset macos -DOPENCMR2_VENDORED_SDL=ON
      - run: cmake --build --preset macos
      - run: ctest --timeout 120 --preset macos
      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/build_certificate.p12"
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12 -k "$keychain"
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
      - name: Package zip and DMG
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
        run: |
          set -o pipefail
          version="$(python3 -c "import datetime;d=datetime.datetime.utcnow();print(f'{d.year}.{d.month}.{d.day}')").${GITHUB_RUN_NUMBER}-$(git rev-parse --short=8 HEAD)"
          python3 tools/package_release.py --binary build/macos/src/opencmr2 \
            --library build/macos/src/libSDL3.0.dylib \
            --license build/macos/_deps/sdl3-src/LICENSE.txt \
            --output dist/OpenCMR2-macOS-arm64.zip
          tools/make_dmg.sh dist/OpenCMR2-macOS-arm64.zip "$version" dist
          mkdir -p dist/shots
          OPENCMR2_TEST_SHOTS="$PWD/dist/shots" tools/test_macos_app.sh dist/OpenCMR2-macOS-arm64-$version.dmg 2>&1 | tee dist/test-macos-app.log
          echo "built from $(git rev-parse HEAD) version $version" | tee dist/BUILD-INFO.txt
      - name: Remove signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCMR2-macOS-arm64-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/BUILD-INFO.txt
            dist/test-macos-app.log
            dist/shots/*.png
          if-no-files-found: error
